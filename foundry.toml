[profile.default]
bytecode_hash = "none"
evm_version = "cancun"
ffi = true
fs_permissions = [{access = "read-write", path = ".forge-snapshots/"}]
libs = ["lib"]
out = "out"
optimizer = true
optimizer_runs = 200
solc_version = "0.8.30"
src = "src"
via_ir = true

[invariant]
runs = 32
depth = 48
fail_on_revert = true

[lint]
exclude_lints = ["screaming-snake-case-immutable", "screaming-snake-case-const"]
lint_on_build = false
